breadcrumb:
  - label: Home
    url: /
  - label: Docs
    url: /docs/
  - label: Components
    url: /docs/components/
  - label: Button

button_group:
  - label: Day
    active: true
  - label: Week
  - label: Month
  - label: Year

dropdown_items:
  - label: Account
    label_only: true
  - label: Profile
    href: /docs/components/avatar/
  - label: Preferences
    href: /docs/components/theme-toggle/
  - divider: true
  - label: Disabled action
    disabled: true
  - label: Sign out
    danger: true

select_options:
  - value: basic
    label: Basic
    icon: check-circle
    description: Core features for getting started.
    badge: Free
    badge_variant: success
  - value: pro
    label: Pro
    icon: info
    description: More tools for growing teams.
    badge: Popular
    badge_variant: primary
    variant: info
  - value: enterprise
    label: Enterprise
    icon: user
    description: Advanced controls and dedicated support.
    badge: Custom
    badge_variant: neutral

accordion_items:
  - title: Can I customize the component styles?
    content: Yes. Override the design tokens or add your own classes to customize the components.
    open: true
  - title: Do the components work without JavaScript?
    content: Most components are rendered with HTML and CSS. Interactive components use JavaScript for their enhanced behavior.

tab_items:
  - label: Overview
    content: View a summary of your account and recent activity.
  - label: Security
    content: Manage your password and other account security settings.
  - label: Notifications
    content: Choose which notifications you would like to receive.

badge_examples:
  - label: Active
    variant: success
    dot: true
  - label: In review
    variant: warning
  - label: Draft
    variant: neutral
    badge_size: sm

tooltip_example:
  label: Help
  text: More information about this setting.
  position: top

modal_example:
  id: docs-modal
  trigger_label: Open demo modal
  title: Confirm changes
  body: Review your changes before continuing.
  size: md

checkbox_example:
  name: docs-checkbox
  value: accepted
  label: I agree to the terms

radio_examples:
  name: docs-plan
  options:
    - value: basic
      label: Basic
      checked: true
    - value: pro
      label: Pro

blog_breadcrumb:
