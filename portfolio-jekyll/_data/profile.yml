about_paragraphs:
  - "I'm Raka, an independent product designer working at the intersection of product thinking, visual craft, and the small details that make software feel effortless."
  - "Over the last 8 years, I've helped early-stage teams and established brands find clarity in complex products. I value honest collaboration, thoughtful systems, and work that makes a measurable difference."
  - "When I'm not sketching flows, you'll find me collecting old magazines, taking long walks, or looking for the best coffee in town."
principles:
  - "Make the complex feel clear."
  - "Sweat the details that matter."
  - "Build trust through collaboration."
