# =============================================================================
# Thicket UI - Jekyll component garden
# =============================================================================

title: Thicket UI — Jekyll Component Garden
version: 1.4.0
description: A living component garden for distinctive, accessible Jekyll sites.
url: "https://daffadevhosting.github.io" # Set in production (e.g. https://example.com)
baseurl: "/jekyll-component-framework" # Set if deploying to a subdirectory

# Author
author:
  name: Daffa Dev
  email: "daffa@dev.com"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
timezone: Asia/Jakarta

# Keep SCSS imports resolvable by GitHub Pages' Sass converter.
sass:
  sass_dir: assets/scss

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "docs"
      type: "docs"
    values:
      layout: "docs"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - LICENSE
  - CHANGELOG.md
  - CONTRIBUTING.md
  - scripts
  - examples

# Include
include:
  - _pages

# =============================================================================
# Theme Configuration
# =============================================================================
theme_config:
  # Primary brand color (can also be overridden via CSS variables)
  primary_color: "#285943"
  # Border radius scale: sm | md | lg | xl
  radius: "md"
  # Enable dark mode support
  dark_mode: true
  # Enable animation system
  animations: true
  # Default theme: light | dark | system
  default_theme: "system"

# SEO
lang: en
locale: en_US

# Feed
feed:
  path: /feed.xml
